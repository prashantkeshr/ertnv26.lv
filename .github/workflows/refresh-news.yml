name: Refresh news snapshot

on:
  schedule:
    - cron: '30 4 * * *' # daily, 04:30 UTC
  workflow_dispatch:

# Commits made with the default token do not trigger other workflows, so this job
# commits the refreshed snapshot and then starts the deploy workflow explicitly.
permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch official news feeds
        run: npm run data:news
      - name: Validate
        run: npm run data:build && npm run data:validate
      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- public/data/news/latest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new headlines."
          else
            git config user.name "eport news bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/data/news/latest.json
            git commit -m "Refresh news snapshot"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
