<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B1F33" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Apply a saved Light/Dark choice before first paint, so there is no flash. "Automatic" needs nothing. */
      try {
        var t = JSON.parse(localStorage.getItem("eport:theme"));
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>eport — Global Trade &amp; Maritime Intelligence</title>
    <meta name="description" content="eport is an independent platform for international trade information, export-import education, maritime intelligence and trade documentation." />
    <link rel="canonical" href="https://eport.live/" />
    <meta property="og:site_name" content="eport" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="eport — Global Trade &amp; Maritime Intelligence" />
    <meta property="og:description" content="eport is an independent platform for international trade information, export-import education, maritime intelligence and trade documentation." />
    <meta property="og:url" content="https://eport.live/" />
    <meta name="twitter:card" content="summary" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "eport",
        "url": "https://eport.live/",
        "description": "Independent global trade and maritime information platform, a subsidiary of Dhurta.org and managed by Dhurta Group.",
        "email": "support@dhurta.org",
        "parentOrganization": { "@type": "Organization", "name": "Dhurta.org", "url": "https://dhurta.org" },
        "contactPoint": { "@type": "ContactPoint", "contactType": "customer support", "email": "support@dhurta.org" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem">
        eport is an independent global trade and maritime intelligence platform, a subsidiary of Dhurta.org managed by Dhurta Group. This site needs JavaScript to run its search, data and
        tools in your browser. Contact: support@dhurta.org
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
